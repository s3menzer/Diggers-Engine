name: Linux and Windows Docker builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out Diggers game source
        uses: actions/checkout@v4
        with:
          repository: s3menzer/Diggers
          ref: cd556a06dec2250b3cc91563ab032899257a8e61
          path: Diggers

      - name: Build and package Diggers for Linux
        env:
          CONTAINER_ENGINE: docker
          LINUX_BUILDER_IMAGE: mhatxotic-engine-linux-builder:ci
        run: ./.build-helpers/scripts/docker-build-linux.sh

      - name: Upload Linux Diggers package
        uses: actions/upload-artifact@v4
        with:
          name: diggers-linux-${{ github.sha }}
          path: distro/Diggers-*-Ubuntu-X64.7z
          if-no-files-found: error
          compression-level: 0

  windows:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Engine
        uses: actions/checkout@v4

      - name: Check out Diggers game source
        uses: actions/checkout@v4
        with:
          repository: s3menzer/Diggers
          ref: cd556a06dec2250b3cc91563ab032899257a8e61
          path: Diggers

      - name: Build and package Diggers for Windows
        env:
          CONTAINER_ENGINE: docker
          WINDOWS_BUILDER_IMAGE: mhatxotic-engine-windows-builder:ci
        run: ./.build-helpers/scripts/docker-build-windows.sh

      - name: Upload Windows Diggers package
        uses: actions/upload-artifact@v4
        with:
          name: diggers-windows-${{ github.sha }}
          path: distro/Diggers-*-Windows-X64.7z
          if-no-files-found: error
          compression-level: 0
